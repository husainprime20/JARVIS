name: Build Windows EXE

# Build the Rust/Tauri JARVIS desktop app. This workflow does not package or
# bootstrap the retired Python backend or an Ollama sidecar.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-windows-exe.yml"
      - "scripts/build-exe.ps1"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (SemVer); defaults to tauri.conf.json.
        required: false
        default: ""
        type: string
      publish_release:
        description: Publish the unsigned installer as a GitHub pre-release.
        required: false
        default: false
        type: boolean

concurrency:
  group: build-windows-exe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.config.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use supported npm
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Read build version
        id: config
        shell: bash
        env:
          EXE_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync, writeFileSync } = require('node:fs');
          const config = JSON.parse(readFileSync('frontend/src-tauri/tauri.conf.json', 'utf8'));
          const version = process.env.EXE_VERSION || config.version;
          if (!/^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$/.test(version)) throw new Error(`Invalid SemVer: ${version}`);
          writeFileSync('frontend/src-tauri/tauri.windows-exe.conf.json', JSON.stringify({version, bundle: {createUpdaterArtifacts: false}}, null, 2));
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(`Building JARVIS ${version}`);
          NODE

      - name: Build NSIS installer
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows-exe.conf.json *> tauri-build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content tauri-build.log
          if ($buildExitCode -ne 0) {
            $diagnostics = Select-String -Path tauri-build.log -Pattern 'error\[|error:|failed|could not|cannot find|not found' | Select-Object -Last 12
            if ($diagnostics) {
              $message = (($diagnostics | ForEach-Object { $_.Line.Trim() }) -join ' | ').Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Tauri build diagnostics::$message"
            }
          }
          exit $buildExitCode

      - name: Upload Tauri build log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-tauri-build-log
          if-no-files-found: warn
          retention-days: 7
          path: frontend/tauri-build.log

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-windows-exe
          if-no-files-found: error
          retention-days: 14
          path: frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  release:
    name: Publish pre-release
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: jarvis-windows-exe
          path: installer

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          short="${SHA::7}"
          tag="jarvis-v${VERSION}-${short}"
          cat > notes.md <<EOF
          JARVIS desktop for Windows 10/11 x64, built from \`${REF_NAME}\` at ${short}.

          Install the unsigned installer (Windows SmartScreen may require **More info → Run anyway**). On first launch, open Settings and save a Gemini API key from https://aistudio.google.com/api-keys. Keys are stored in Windows Credential Manager. Ollama is optional and is not installed or started by this release.

          Press **Ctrl+Alt+J** to bring up JARVIS. The app includes a floating always-on-top orb and voice input; when WebView2 speech recognition is unavailable it records a short clip for Gemini transcription.
          EOF
          gh release create "$tag" installer/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --prerelease \
            --title "JARVIS for Windows ${VERSION} (${short})" \
            --notes-file notes.md
